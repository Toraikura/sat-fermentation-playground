name: Finalize AROMA LAB asset branch

on:
  push:
    branches:
      - aroma-lab-60-icons
    paths:
      - aroma-lab/.finalize-aroma-assets

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: aroma-lab-60-icons
          fetch-depth: 0

      - name: Verify icon asset counts
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          master_count=$(find aroma-lab/assets/aroma-lab/master -maxdepth 1 -type f -name 'aroma-*.png' 2>/dev/null | wc -l | tr -d ' ')
          web_count=$(find aroma-lab/assets/aroma-lab/web -maxdepth 1 -type f -name 'aroma-*.webp' 2>/dev/null | wc -l | tr -d ' ')
          echo "master_count=$master_count" >> "$GITHUB_OUTPUT"
          echo "web_count=$web_count" >> "$GITHUB_OUTPUT"
          test "$master_count" = "60"
          test "$web_count" = "60"

      - name: Clean staging files after successful sync
        if: steps.verify.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf aroma-lab/assets/aroma-lab/_transfer
          rm -f aroma-lab/.sync-aroma-icons aroma-lab/.sync-aroma-icons-v2 aroma-lab/.finalize-aroma-assets
          rm -f aroma-lab/DRIVE_SYNC_PROBE.md aroma-lab/CHECKPOINT.md aroma-lab/AROMA_ASSET_SYNC_FAILED.md
          rm -f .github/workflows/unpack-aroma-assets.yml .github/workflows/sync-aroma-drive.yml .github/workflows/sync-aroma-drive-v2.yml .github/workflows/finalize-aroma-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finalize AROMA LAB asset integration" || true
          git push origin HEAD:aroma-lab-60-icons

      - name: Record failed asset sync
        if: steps.verify.outcome != 'success'
        shell: bash
        env:
          MASTER_COUNT: ${{ steps.verify.outputs.master_count }}
          WEB_COUNT: ${{ steps.verify.outputs.web_count }}
        run: |
          set -euo pipefail
          cat > aroma-lab/AROMA_ASSET_SYNC_FAILED.md <<EOF
          # AROMA LAB asset sync incomplete

          master_png_count: ${MASTER_COUNT:-0}
          webp_count: ${WEB_COUNT:-0}
          expected_each: 60
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aroma-lab/AROMA_ASSET_SYNC_FAILED.md
          git commit -m "chore: record incomplete AROMA LAB asset sync" || true
          git push origin HEAD:aroma-lab-60-icons
          exit 1
