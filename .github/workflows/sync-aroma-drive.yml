name: Sync AROMA LAB icons from Drive

on:
  push:
    branches:
      - aroma-lab-60-icons
    paths:
      - aroma-lab/.sync-aroma-icons

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: aroma-lab-60-icons
          fetch-depth: 0

      - name: Download 60 PNG masters from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          target="aroma-lab/assets/aroma-lab"
          master="$target/master"
          web="$target/web"
          rm -rf "$master" "$web"
          mkdir -p "$master" "$web"

          download_drive() {
            local name="$1" id="$2" out="$master/$name"
            curl -fL --retry 3 --retry-delay 2 \
              "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t" \
              -o "$out"
            sig=$(head -c 8 "$out" | od -An -tx1 | tr -d ' \n')
            if [ "$sig" != "89504e470d0a1a0a" ]; then
              echo "Not a PNG: $name" >&2
              exit 1
            fi
          }

          while IFS='|' read -r name id; do
            [ -z "$name" ] && continue
            download_drive "$name" "$id"
          done <<'FILES'
          aroma-banana.png|1HfnLmzenMwQhhQldSgkWThA8QonA88Pg
          aroma-apple-red.png|1JJvYKI1yzbb_0oQ-82ISHXu3A41ZqQmS
          aroma-apple-green.png|1g9CroffamE_L9YwEK2Z7xuY6ivKn-Khr
          aroma-strawberry-candy.png|1C5f-u7XqvqNa7PxtU7pqjRAyVZSj3Uo9
          aroma-grapefruit.png|1D77jhyPP0ugEZmFUn6XIB5Bw-_6A4TtO
          aroma-rose.png|1cZ-qhX7g1U_bI7UmzT5gcEWuONM6iGHz
          aroma-violet.png|1RI_6EZ6d0M2Ylu1CJoqnjHvI6clHuHSs
          aroma-lavender.png|1K8ajsmtJeV0XTZ89ZJM9r_zyNynFCnwt
          aroma-sweet-flower.png|1haIPwZD3g5DK_07rUZtW-2zofNJVfOeu
