          aroma-takuan.png|1V9kV5dfskivJ-e2_41TZ3NOh5-QLuSM1
          aroma-pickles.png|16pjVDZ8PbVYa9nvhfIHMjqlTC4fErVrD
          aroma-natto.png|1AuuorKGPSjVCMDpUylrMcUR0Rbnt8Fux
          FILES

          count=$(find "$master" -maxdepth 1 -type f -name 'aroma-*.png' | wc -l | tr -d ' ')
          test "$count" = "60"

      - name: Generate lightweight WebP delivery copies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          master="aroma-lab/assets/aroma-lab/master"
          web="aroma-lab/assets/aroma-lab/web"
          mkdir -p "$web"
          for f in "$master"/aroma-*.png; do
            base=$(basename "$f" .png)
            cwebp -quiet -q 72 -resize 160 160 "$f" -o "$web/$base.webp"
          done
          count=$(find "$web" -maxdepth 1 -type f -name 'aroma-*.webp' | wc -l | tr -d ' ')
          test "$count" = "60"

      - name: Clean staging transfer and commit assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf aroma-lab/assets/aroma-lab/_transfer
          rm -f aroma-lab/.sync-aroma-icons
          rm -f .github/workflows/unpack-aroma-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A aroma-lab/assets/aroma-lab aroma-lab/.sync-aroma-icons .github/workflows/unpack-aroma-assets.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: add AROMA LAB 60 icon assets"
          git push origin HEAD:aroma-lab-60-icons
