name: Unpack AROMA LAB hotfix assets

on:
  push:
    branches:
      - aroma-lab-name-first-hotfix
    paths:
      - aroma-lab/assets/aroma-lab/_transfer128/READY

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aroma-lab-name-first-hotfix
          fetch-depth: 0
      - name: Reassemble and unpack assets
        shell: bash
        run: |
          set -euo pipefail
          transfer="aroma-lab/assets/aroma-lab/_transfer128"
          target="aroma-lab/assets/aroma-lab"
          archive="$target/aroma-web-128.tar.gz"
          cat "$transfer"/part-* > "$archive.b64"
          base64 -d "$archive.b64" > "$archive"
          rm "$archive.b64"
          mkdir -p "$target"
          tar -xzf "$archive" -C "$target"
          count=$(find "$target/web" -maxdepth 1 -type f -name 'aroma-*.webp' | wc -l | tr -d ' ')
          test "$count" = "60"
          rm "$archive"
          rm -rf "$transfer"
      - name: Commit extracted assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A aroma-lab/assets/aroma-lab
          git diff --cached --quiet && exit 0
          git commit -m "feat: add 60 AROMA LAB web icons [skip ci]"
          git push origin HEAD:aroma-lab-name-first-hotfix
