name: Unpack AROMA LAB assets

on:
  push:
    branches:
      - aroma-lab-60-icons
    paths:
      - aroma-lab/assets/aroma-lab/_transfer/aroma-web-192.tar.b64.part25

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: aroma-lab-60-icons
          fetch-depth: 0

      - name: Decode and unpack web delivery assets
        shell: bash
        run: |
          set -euo pipefail
          transfer="aroma-lab/assets/aroma-lab/_transfer"
          archive="$RUNNER_TEMP/aroma-web-192.tar.gz"
          target="aroma-lab/assets/aroma-lab"
          count_parts=$(find "$transfer" -maxdepth 1 -type f -name 'aroma-web-192.tar.b64.part*' | wc -l | tr -d ' ')
          test "$count_parts" = "25"
          cat "$transfer"/aroma-web-192.tar.b64.part* | base64 --decode > "$archive"
          echo "3b9b759f33b2502663934762be1921cf7f2fe11bcf6f12b49082fe77669a73f1  $archive" | sha256sum -c -
          mkdir -p "$target"
          tar -xzf "$archive" -C "$target"
          count=$(find "$target/web" -maxdepth 1 -type f -name 'aroma-*.webp' | wc -l | tr -d ' ')
          test "$count" = "60"
          rm -rf "$transfer"

      - name: Commit extracted assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aroma-lab/assets/aroma-lab
          git diff --cached --quiet && exit 0
          git commit -m "feat: add 60 AROMA LAB web icons [skip ci]"
          git push origin HEAD:aroma-lab-60-icons
