name: Build AROMA MATCH thumbnails

on:
  push:
    branches:
      - perf/aroma-match-lightweight
    paths:
      - '.github/workflows/optimize-aroma-match-thumbs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-thumbnails:
    if: ${{ !contains(github.event.head_commit.message, 'Generate AROMA MATCH thumbnails') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: perf/aroma-match-lightweight

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Generate 240px WebP thumbnails
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path('aroma-lab/assets/aroma-lab/master')
          target = Path('aroma-lab/assets/aroma-lab/thumbs')
          target.mkdir(parents=True, exist_ok=True)

          count = 0
          for path in sorted(source.glob('aroma-*.png')):
              with Image.open(path) as image:
                  image = image.convert('RGB')
                  image.thumbnail((240, 240), Image.Resampling.LANCZOS)
                  out = target / f'{path.stem}.webp'
                  image.save(out, 'WEBP', quality=76, method=6, optimize=True)
                  count += 1
          print(f'generated {count} thumbnails')
          PY

      - name: Commit generated thumbnails
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aroma-lab/assets/aroma-lab/thumbs
          if git diff --cached --quiet; then
            echo 'No thumbnail changes.'
            exit 0
          fi
          git commit -m 'Generate AROMA MATCH thumbnails'
          git push origin HEAD:perf/aroma-match-lightweight
